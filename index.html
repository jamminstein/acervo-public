<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jamminstein.github.io/acervo-public/" />
    <meta property="og:title" content="ACERVO" />
    <meta property="og:image" content="https://jamminstein.github.io/acervo-public/jamminstein.png" />
    <meta property="og:image:secure_url" content="https://jamminstein.github.io/acervo-public/jamminstein.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Jamminstein" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ACERVO" />
    <meta name="twitter:image" content="https://jamminstein.github.io/acervo-public/jamminstein.png" />
    <meta name="twitter:image:alt" content="Jamminstein" />
    <title>ACERVO</title>
    <link rel="preconnect" href="https://jamminstein.github.io" crossorigin />
    <link rel="preload" href="./assets/fonts/unthinkable-pen.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css?v=floating-drums-1" />
  </head>
  <body>
    <nav class="tiago-portal-nav" aria-label="Elsewhere">
      <a href="https://jamminstein.github.io/acervo-public/" aria-current="page">music</a>
      <a href="https://jamminstein.github.io/unthinkable/">unthinkable</a>
      <a href="https://github.com/jamminstein">code</a>
      <a href="https://www.linkedin.com/in/tiagop/">linkedin</a>
    </nav>
    <main id="clips" class="video-grid" aria-label="ACERVO musical video selection"></main>
    <div id="media-host" class="media-host" aria-hidden="true"></div>
    <footer id="transport" class="transport" aria-label="Playback controls" hidden>
      <button id="transport-toggle" class="transport-button transport-toggle" type="button" aria-label="Pause">
        <span aria-hidden="true"></span>
      </button>
      <div id="timeline-shell" class="timeline-shell">
        <canvas id="waveform" class="waveform" aria-hidden="true"></canvas>
        <input
          id="timeline"
          class="timeline"
          type="range"
          min="0"
          max="100"
          step="0.01"
          value="0"
          aria-label="Playback position"
        />
      </div>
      <button id="transport-next" class="transport-button transport-next" type="button" aria-label="Play another clip">
        <span aria-hidden="true"></span>
      </button>
    </footer>
<div id="drumMachine" role="group" aria-label="Drum machine: J kick, K snare, L hi-hat">
<button id="drumRefresh" class="drum-refresh" aria-label="Load new drum samples"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15 7 Q12 2 7 5 Q2 8 5 13 Q9 18 14 13 M15 3 L16 8 L11 8"/></svg></button>
<button class="drum-grab" aria-label="Move drum machine"><svg viewBox="0 0 40 20" aria-hidden="true"><path d="M16 10 L24 9"/></svg></button>
<svg class="drum-shell" viewBox="0 0 120 66" aria-hidden="true"><path d="M8 14 L110 10 L116 58 L5 61 Z M13 22 L106 19 M17 8 L32 6 M82 5 L101 7"/><path d="M17 18 L21 17 M27 17 L31 17 M87 15 L91 15 M98 14 L103 14"/></svg>
<button class="drum-pad" data-drum="kick" aria-label="Kick drum (J)"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 5 L23 4 L24 23 L4 24 Z M9 10 L17 10 L17 18 Q16 23 11 19"/></svg></button>
<button class="drum-pad" data-drum="snare" aria-label="Snare drum (K)"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 5 L23 6 L24 24 L5 23 Z M10 9 L10 20 M18 9 L11 15 L19 20"/></svg></button>
<button class="drum-pad" data-drum="hat" aria-label="Hi-hat (L)"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 4 L24 5 L23 23 L4 24 Z M11 9 L10 20 L19 19"/></svg></button>
</div>
    <script type="module" src="./drum-machine.js?v=pen-player-1"></script>
    <script type="module" src="./acervo-drums.js?v=pen-player-1"></script>
    <script type="module" src="./app.js?v=original-player-1"></script>
  </body>
</html>
