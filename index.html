<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ACERVO</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="clips" class="video-grid" aria-label="ACERVO musical video selection"></main>
    <div id="media-host" class="media-host" aria-hidden="true"></div>
    <footer id="transport" class="transport" aria-label="Playback controls" hidden>
      <button id="transport-toggle" class="transport-button transport-toggle" type="button" aria-label="Pause">
        <span aria-hidden="true"></span>
      </button>
      <input
        id="timeline"
        class="timeline"
        type="range"
        min="0"
        max="100"
        step="0.01"
        value="0"
        aria-label="Playback position"
      />
      <span class="playlist-indicator" role="img" aria-label="Shuffled continuous playlist">🔀︎</span>
      <button id="transport-next" class="transport-button transport-next" type="button" aria-label="Play another clip">
        <span aria-hidden="true"></span>
      </button>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
